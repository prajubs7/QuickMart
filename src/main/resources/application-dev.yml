# Local development: talks to the Postgres container from docker-compose.yml (host port 5433).
spring:
  config:
    # Load DB_* values from .env in the repo root. Two paths because the working directory
    # is backend/ with ./mvnw, but the repo root when VS Code launches the app.
    # "optional:" = no error if the file is missing (e.g. you exported the vars in your shell).
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    # ${NAME:default} -> uses the default when the variable is not set.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:quickmart}
    username: ${DB_USERNAME:quickmart}
    # No default on purpose: a missing password should fail at startup, not silently connect as someone else.
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jpa:
    # Print the SQL Hibernate runs. You'll need this to spot N+1 queries and lock issues later.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

quickmart:
  security:
    jwt:
      # Dev-only fallback so the app starts without setup. Set JWT_SECRET in .env to override.
      # Prod has no fallback (application.yml): a forgotten secret must fail loudly, not use this one.
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

management:
  endpoint:
    health:
      # Show DB/disk status in the health JSON. Useful locally, too revealing for prod.
      show-details: always
