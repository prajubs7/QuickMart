# Shared settings for every profile. Profile files only override what differs.
spring:
  application:
    name: quickmart

  profiles:
    # Running without a profile gives you dev. Prod must be selected explicitly
    # (SPRING_PROFILES_ACTIVE=prod) so you can't start it against prod by accident.
    default: dev

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match the tables.
    hibernate:
      ddl-auto: validate
    # Close the DB session when the transaction ends, not after the HTTP response is written.
    # Lazy-loading bugs then fail loudly in the service layer instead of hiding.
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  kafka:
    producer:
      # Key = orderId as text. Kafka sends equal keys to the same partition,
      # and order is only guaranteed inside a partition: all events of one order stay in order.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Value = the event record as JSON (Jackson 3).
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # By default the producer writes its Java class name (com.quickmart.dto...) into a header.
        # Off: consumers should depend on the JSON shape, not on the producer's package names.
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      # A brand-new consumer group starts from the oldest message, not "only new ones from now".
      auto-offset-reset: earliest
      properties:
        # No type header (see producer), so tell the consumer which class to build from the JSON.
        spring.json.value.default.type: com.quickmart.dto.OrderPlacedEvent

  data:
    redis:
      # Fail fast. The default timeout is 60 s: a hung Redis would hang every catalog request
      # instead of falling back to Postgres.
      timeout: 500ms
      connect-timeout: 500ms
    web:
      pageable:
        # Without a cap, ?size=1000000 loads the whole table into memory in one request.
        max-page-size: 100

quickmart:
  security:
    jwt:
      # HS256 signing key, at least 32 bytes. No default here: prod must set JWT_SECRET or fail to start.
      # Anyone with this value can mint an ADMIN token. Never commit a real one.
      secret: ${JWT_SECRET}
      issuer: quickmart
      # Short: a stolen access token can't be revoked (stateless), so its lifetime IS the damage window.
      access-token-ttl: 15m
      # Long, but rotated on every use and revocable in the DB (logout, reuse detection).
      refresh-token-ttl: 14d
  cache:
    # false = every read goes to Postgres. Flip it to measure "before" vs "after".
    enabled: true
    # How long an entry lives before Redis deletes it. This is also the MAX time a reader
    # can see stale data, because nothing deletes entries when a product changes (yet).
    ttl: 10m
  payment-gateway:
    # 3 s is slower than the retry script's 2 s client timeout: the client gives up,
    # but the server keeps going and charges anyway. That gap is what creates duplicates.
    delay-ms: 3000
    # 20% of charges fail with 502. Set to 0.0 for a clean duplicate demo.
    failure-rate: 0.2
  email:
    # Mock SMTP call. Slow on purpose so you can SEE whether it blocks the HTTP request.
    delay-ms: 2000
  notification:
    # 30% of push notifications fail AFTER the SMS was already sent. Kafka then redelivers the event.
    push-failure-rate: 0.3

management:
  endpoints:
    web:
      # Serve Actuator from the root so health is /health (default would be /actuator/health).
      base-path: /
      exposure:
        # Expose only what we need. Each extra endpoint gives away information.
        # metrics: read cache hit/miss counters and request latency (dev only, see prod yml).
        include: health, metrics
  metrics:
    distribution:
      # Track p50/p95/p99 per endpoint. Averages hide the slow requests users actually notice.
      percentiles:
        "[http.server.requests]": 0.5, 0.95, 0.99
